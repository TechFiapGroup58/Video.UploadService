version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiapx-upload-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     fiapx
      POSTGRES_PASSWORD: fiapx@2024
      POSTGRES_DB:       fiapx_upload
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx_upload"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fiapx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     fiapx
      MINIO_ROOT_PASSWORD: fiapx@2024
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fiapx-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: fiapx
      RABBITMQ_DEFAULT_PASS: fiapx@2024
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  upload-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiapx-upload-service
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=fiapx_upload;Username=fiapx;Password=fiapx@2024"
      Jwt__SecretKey:   "fiapx-super-secret-key-at-least-32-chars-long!"
      Jwt__Issuer:      "fiapx-auth"
      Jwt__Audience:    "fiapx-services"
      Minio__Endpoint:  "minio:9000"
      Minio__AccessKey: "fiapx"
      Minio__SecretKey: "fiapx@2024"
      Minio__BucketName: "videos"
      Minio__UseSSL:    "false"
      RabbitMq__Host:     "rabbitmq"
      RabbitMq__Port:     "5672"
      RabbitMq__Username: "fiapx"
      RabbitMq__Password: "fiapx@2024"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pg_data:
  minio_data:
  rabbitmq_data:
